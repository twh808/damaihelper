name: ci

on:
  push:
    branches: [ "main" ]       # 当 main 分支有推送时自动触发
  workflow_dispatch:           # 也允许你手动在 Actions 页面触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取你的仓库代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 登录 Docker Hub（使用你预先设置的 Secrets）
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. 设置 Docker Buildx（支持多平台构建等高级功能）
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2   # 这里用了稳定的 v2

      # 4. 构建并推送镜像到 Docker Hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v5    # 这里用了稳定的 v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/damaihelper:latest
