name: ci

on:
  push:
    branches: [ "main" ] # 当向 main 分支推送代码时触发
  workflow_dispatch: # 允许你手动在 Actions 页面触发工作流

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 从你的仓库拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 登录 Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. 设置 Docker Buildx (支持多平台构建等高级功能)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3[reference:9]

      # 4. 构建并推送 Docker 镜像
      - name: Build and push Docker image
        uses: docker/build-push-action@v6[reference:10]
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/damaihelper:latest
